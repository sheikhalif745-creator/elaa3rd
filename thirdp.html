<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our 6 Special Memories - Ela 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink-1: #ffdde1;
      --bg-pink-2: #ee9ca7;
      --accent-pink: #ff2a6d;
      --accent-soft: #ff758f;
      --text-main: #4a152b;
      --text-sub: #8a4b66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-pink-1) 0%, var(--bg-pink-2) 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px;
    }

    /* Subtle Ambient Sparkles */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .ambient-bg span {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      opacity: 0.65;
      animation: softRise linear infinite;
      filter: drop-shadow(0 4px 8px rgba(255, 42, 109, 0.18));
      will-change: transform, opacity;
    }

    .ambient-bg span:nth-child(1) { left: 10%; animation-duration: 8s;  animation-delay: 0s; }
    .ambient-bg span:nth-child(2) { left: 28%; animation-duration: 9.5s; animation-delay: 1.8s; font-size: 24px; }
    .ambient-bg span:nth-child(3) { left: 50%; animation-duration: 8.5s; animation-delay: 3.1s; }
    .ambient-bg span:nth-child(4) { left: 72%; animation-duration: 10s; animation-delay: 1.1s; font-size: 23px; }
    .ambient-bg span:nth-child(5) { left: 90%; animation-duration: 8.8s; animation-delay: 2.4s; }

    @keyframes softRise {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.7;
      }
      50% {
        transform: translate3d(12px, -55vh, 0) rotate(12deg);
      }
      100% {
        transform: translate3d(-12px, -115vh, 0) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Slider Card */
    .slider-shell {
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 32px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 55px rgba(173, 20, 87, 0.18);
      padding: 28px 22px 26px;
      position: relative;
      z-index: 10;
    }

    .slider-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .counter-pill {
      display: inline-block;
      background: #ffffff;
      color: var(--accent-pink);
      border: 1px solid #ffc2d4;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(255, 42, 109, 0.12);
    }

    .slider-header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 44px;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .slider-header p {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* Stage Where One Photo Slides Smoothly */
    .carousel-stage {
      position: relative;
      min-height: 355px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 48px;
      overflow: hidden;
      touch-action: pan-y;
    }

    /* Consistent Polaroid Frame Design */
    .polaroid-slide {
      background: #ffffff;
      padding: 12px 12px 16px;
      border-radius: 8px;
      box-shadow: 0 16px 34px rgba(120, 25, 62, 0.2);
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0) rotate(-1.2deg);
      transition:
        transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease,
        box-shadow 0.25s ease;
    }

    .polaroid-slide:hover {
      box-shadow: 0 22px 42px rgba(255, 42, 109, 0.26);
    }

    /* Smooth Out & In Shifting States */
    .polaroid-slide.is-leaving-next {
      opacity: 0;
      transform: translate3d(-42px, 0, 0) rotate(-3.5deg) scale(0.97);
    }

    .polaroid-slide.is-leaving-prev {
      opacity: 0;
      transform: translate3d(42px, 0, 0) rotate(3.5deg) scale(0.97);
    }

    .polaroid-slide.is-entering-next {
      transition: none;
      opacity: 0;
      transform: translate3d(42px, 0, 0) rotate(3.5deg) scale(0.97);
    }

    .polaroid-slide.is-entering-prev {
      transition: none;
      opacity: 0;
      transform: translate3d(-42px, 0, 0) rotate(-3.5deg) scale(0.97);
    }

    .heart-pin {
      position: absolute;
      top: -12px;
      right: -9px;
      font-size: 25px;
      z-index: 6;
      transform: rotate(15deg);
      filter: drop-shadow(0 4px 7px rgba(255, 42, 109, 0.32));
      pointer-events: none;
    }

    /* Adaptive Polaroid Photo Container Based on Real Image Aspect Ratio */
    .polaroid-photo-box {
      border-radius: 4px;
      overflow: hidden;
      background: #ffe9f0;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1), height 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Default Portrait Frame */
    .polaroid-photo-box.is-portrait {
      width: 225px;
      height: 285px;
    }

    /* Default Square Frame */
    .polaroid-photo-box.is-square {
      width: 245px;
      height: 245px;
    }

    /* Default Landscape Frame */
    .polaroid-photo-box.is-landscape {
      width: 300px;
      height: 205px;
    }

    .polaroid-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: object-position 0.25s ease;
    }

    .polaroid-caption {
      margin-top: 12px;
      text-align: center;
      font-family: 'Sacramento', cursive;
      font-size: 28px;
      line-height: 1.15;
      color: var(--text-main);
    }

    .tap-hint {
      margin-top: 4px;
      text-align: center;
      font-size: 10.5px;
      color: var(--text-sub);
    }

    /* Prev / Next Arrow Buttons */
    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translate3d(0, -50%, 0);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid #ffc2d4;
      background: rgba(255, 255, 255, 0.95);
      color: var(--accent-pink);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 16px rgba(255, 42, 109, 0.18);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 12;
    }

    .arrow-btn:hover {
      transform: translate3d(0, -50%, 0) scale(1.08);
      background: #fff0f5;
    }

    .arrow-btn.prev-btn {
      left: 6px;
    }

    .arrow-btn.next-btn {
      right: 6px;
    }

    /* Slide Dots Indicator */
    .slide-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .slide-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 42, 109, 0.25);
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-dot.active {
      width: 22px;
      border-radius: 999px;
      background: var(--accent-pink);
    }

    /* Bottom Navigation */
    .bottom-nav {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed rgba(255, 117, 143, 0.45);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: linear-gradient(135deg, #ff2a6d, #ff758f);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 6px 16px rgba(255, 42, 109, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(255, 42, 109, 0.34);
    }

    .nav-btn.secondary {
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      border: 1px solid #ffc2d4;
      box-shadow: 0 4px 12px rgba(255, 42, 109, 0.1);
    }

    /* Special Message Modal */
    .memory-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(58, 12, 32, 0.55);
      backdrop-filter: blur(7px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .memory-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-modal-card {
      width: 100%;
      max-width: 390px;
      background: #fff9fb;
      border-radius: 26px;
      border: 2px solid #ffffff;
      box-shadow: 0 25px 60px rgba(80, 10, 40, 0.35);
      padding: 20px 20px 24px;
      text-align: center;
      position: relative;
      transform: scale(0.9) translate3d(0, 14px, 0);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .memory-modal-backdrop.active .memory-modal-card {
      transform: scale(1) translate3d(0, 0, 0);
    }

    .close-modal-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #ffe3ec;
      color: var(--accent-pink);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-photo-frame {
      background: #ffffff;
      padding: 9px 9px 12px;
      border-radius: 10px;
      box-shadow: 0 10px 22px rgba(173, 20, 87, 0.14);
      margin-bottom: 14px;
    }

    .modal-photo-frame img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 6px;
      display: block;
      background: #fff3f7;
    }

    .modal-tag {
      display: inline-block;
      background: #ffe6ee;
      color: var(--accent-pink);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'Great Vibes', cursive;
      font-size: 36px;
      color: var(--accent-pink);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .modal-note {
      font-family: 'Sacramento', cursive;
      font-size: 27px;
      line-height: 1.38;
      color: var(--text-main);
    }

    @media (max-width: 520px) {
      .slider-shell {
        padding: 22px 14px 20px;
        border-radius: 24px;
      }
      .slider-header h1 {
        font-size: 38px;
      }
      .carousel-stage {
        padding: 14px 38px;
        min-height: 315px;
      }
      .polaroid-photo-box.is-portrait {
        width: 185px;
        height: 235px;
      }
      .polaroid-photo-box.is-square {
        width: 205px;
        height: 205px;
      }
      .polaroid-photo-box.is-landscape {
        width: 230px;
        height: 160px;
      }
      .polaroid-caption {
        font-size: 24px;
      }
      .arrow-btn {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <span>💖</span>
    <span>✨</span>
    <span>🎈</span>
    <span>💕</span>
    <span>🌸</span>
  </div>

  <div class="slider-shell">
    <div class="slider-header">
      <div class="counter-pill" id="counterPill">Memory 1 / 6</div>
      <h1>Our 6 Special Memories</h1>
      <p>Slide or tap arrows to view one by one — tap photo for special note ✨</p>
    </div>

    <div class="carousel-stage" id="carouselStage">
      <button class="arrow-btn prev-btn" onclick="prevSlide()" aria-label="Previous">‹</button>

      <div class="polaroid-slide" id="polaroidSlide" onclick="openCurrentModal()">
        <div class="heart-pin">💖</div>
        <div class="polaroid-photo-box is-portrait" id="photoBox">
          <img id="slideImg" src="p1.jpeg" alt="Memory">
        </div>
        <div class="polaroid-caption" id="slideCaption">First Spark ✨</div>
        <div class="tap-hint">Tap photo to read message</div>
      </div>

      <button class="arrow-btn next-btn" onclick="nextSlide()" aria-label="Next">›</button>
    </div>

    <div class="slide-dots" id="slideDots"></div>

    <div class="bottom-nav">
      <a href="chithi.html" class="nav-btn secondary">← Back to Letter</a>
      <a href="index.html" class="nav-btn">🔒 Lock Screen</a>
    </div>
  </div>

  <!-- Special Message Modal -->
  <div class="memory-modal-backdrop" id="memoryModal" onclick="handleBackdropClick(event)">
    <div class="memory-modal-card">
      <button class="close-modal-btn" onclick="closeMemoryModal()" aria-label="Close">✕</button>
      <div class="modal-photo-frame">
        <img id="modalImg" src="" alt="Special Memory">
      </div>
      <div class="modal-tag" id="modalTag">Memory 01</div>
      <h2 class="modal-title" id="modalTitle">Title</h2>
      <p class="modal-note" id="modalNote">Special message...</p>
    </div>
  </div>

  <script>
    // ৬টি ছবির তথ্য:
    // image: ছবির ফাইলের নাম
    // focus: ছবিতে কোনো চেহারা/বিষয় ওপরে থাকলে "center top", নিচে থাকলে "center bottom", মাঝখানে থাকলে "center center"
    // caption: ফ্রেমের নিচের লেখা
    // title & note: ছবিতে ক্লিক করলে যে বিশেষ কথা দেখাবে
    const memoriesData = [
      {
        image: "first.jpeg",
        focus: "center top",
        caption: "First Spark ✨",
        tag: "Memory 01 💖",
        title: "Where It Started",
        note: "From the very first moment that felt so effortless, something quiet and special began in my heart."
      },
      {
        image: "second.jpeg",
        focus: "center center",
        caption: "Golden Hours 🌅",
        tag: "Memory 02 ✨",
        title: "Soft & Unforgettable",
        note: "Even simple moments turn into favorites when I get to share them with you."
      },
      {
        image: "third.jpeg",
        focus: "center top",
        caption: "Favorite Smile 😊",
        tag: "Memory 03 💕",
        title: "Pure Happiness",
        note: "Your smile has a way of making every heavy day feel lighter in seconds."
      },
      {
        image: "forth.jpeg",
        focus: "center center",
        caption: "Side By Side 💑",
        tag: "Memory 04 🌸",
        title: "Better Together",
        note: "Wherever life takes us, walking beside you is always my favorite place to be."
      },
      {
        image: "fifth.jpeg",
        focus: "center top",
        caption: "Dreamy Vibe 🌙",
        tag: "Memory 05 💫",
        title: "Always In My Thoughts",
        note: "Some memories stay close like a warm song you never get tired of hearing."
      },
      {
        image: "sixth.jpeg",
        focus: "center center",
        caption: "Happy Birthday Ela 🎂",
        tag: "Memory 06 💖",
        title: "Here’s To You",
        note: "Wishing you endless joy, peace, and every dream you hold dear. Happy Birthday, my love!"
      }
    ];

    let currentIndex = 0;
    let isTransitioning = false;

    const slideEl = document.getElementById("polaroidSlide");
    const photoBoxEl = document.getElementById("photoBox");
    const slideImgEl = document.getElementById("slideImg");
    const slideCaptionEl = document.getElementById("slideCaption");
    const counterPillEl = document.getElementById("counterPill");
    const dotsContainerEl = document.getElementById("slideDots");
    const stageEl = document.getElementById("carouselStage");

    const modalEl = document.getElementById("memoryModal");
    const modalImgEl = document.getElementById("modalImg");
    const modalTagEl = document.getElementById("modalTag");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalNoteEl = document.getElementById("modalNote");

    // সব ৬টি ছবি আগে থেকে ব্রাউজারে প্রি-লোড করে রাখা যাতে স্লাইড করার সময় lag না হয়
    function preloadAllImages() {
      memoriesData.forEach((item) => {
        const preImg = new Image();
        preImg.src = item.image;
      });
    }

    // ছবির আসল সাইজ (naturalWidth / naturalHeight) অনুযায়ী ফ্রেমের orientation ঠিক করা
    function applyAdaptiveFrame(src, focusPos = "center center") {
      slideImgEl.style.objectPosition = focusPos;

      const checker = new Image();
      checker.onload = () => {
        const ratio = checker.naturalWidth / checker.naturalHeight;
        photoBoxEl.classList.remove("is-portrait", "is-square", "is-landscape");

        if (ratio < 0.88) {
          photoBoxEl.classList.add("is-portrait");
        } else if (ratio > 1.15) {
          photoBoxEl.classList.add("is-landscape");
        } else {
          photoBoxEl.classList.add("is-square");
        }
      };
      checker.src = src;
    }

    function renderDots() {
      dotsContainerEl.innerHTML = "";
      memoriesData.forEach((_, idx) => {
        const dot = document.createElement("button");
        dot.className = "slide-dot" + (idx === currentIndex ? " active" : "");
        dot.setAttribute("aria-label", `Go to slide ${idx + 1}`);
        dot.onclick = () => {
          if (idx === currentIndex || isTransitioning) return;
          const dir = idx > currentIndex ? "next" : "prev";
          goToSlide(idx, dir, true);
        };
        dotsContainerEl.appendChild(dot);
      });
    }

    function updateSlideContent(index) {
      const total = memoriesData.length;
      const item = memoriesData[index];

      applyAdaptiveFrame(item.image, item.focus);
      slideImgEl.src = item.image;
      slideImgEl.alt = item.caption;
      slideCaptionEl.textContent = item.caption;
      counterPillEl.textContent = `Memory ${index + 1} / ${total}`;
      renderDots();
    }

    function goToSlide(newIndex, direction = "next", animate = true) {
      const total = memoriesData.length;
      const targetIndex = (newIndex + total) % total;

      if (!animate) {
        currentIndex = targetIndex;
        updateSlideContent(currentIndex);
        return;
      }

      if (isTransitioning) return;
      isTransitioning = true;

      // ১. বর্তমান কার্ড স্মুথভাবে সরে যাবে
      slideEl.classList.remove("is-entering-next", "is-entering-prev", "is-leaving-next", "is-leaving-prev");
      slideEl.classList.add(direction === "prev" ? "is-leaving-prev" : "is-leaving-next");

      setTimeout(() => {
        currentIndex = targetIndex;
        updateSlideContent(currentIndex);

        // ২. নতুন দিক থেকে কার্ডটি স্মুথভাবে ঢুকবে
        slideEl.classList.remove("is-leaving-next", "is-leaving-prev");
        slideEl.classList.add(direction === "prev" ? "is-entering-prev" : "is-entering-next");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            slideEl.classList.remove("is-entering-next", "is-entering-prev");
            setTimeout(() => {
              isTransitioning = false;
            }, 340);
          });
        });
      }, 170);
    }

    function nextSlide() {
      goToSlide(currentIndex + 1, "next", true);
    }

    function prevSlide() {
      goToSlide(currentIndex - 1, "prev", true);
    }

    function openCurrentModal() {
      const item = memoriesData[currentIndex];
      if (!item) return;

      modalImgEl.src = item.image;
      modalImgEl.alt = item.caption;
      modalTagEl.textContent = item.tag;
      modalTitleEl.textContent = item.title;
      modalNoteEl.textContent = item.note;

      modalEl.classList.add("active");
    }

    function closeMemoryModal() {
      modalEl.classList.remove("active");
    }

    function handleBackdropClick(event) {
      if (event.target === modalEl) {
        closeMemoryModal();
      }
    }

    // Touch swipe support for mobile sliding
    let touchStartX = 0;
    stageEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stageEl.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 40) {
        if (diff < 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextSlide();
      else if (e.key === "ArrowLeft") prevSlide();
      else if (e.key === "Escape") closeMemoryModal();
    });

    preloadAllImages();
    goToSlide(0, "next", false);
  </script>
</body>
</html>
